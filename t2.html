<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>the</title>
</head>
<body style="background-color: black;">
    <script>
        function sep(str)
        {
            let half1,half2=str;
            let arr = [];
            let pos = 0;
            pos = half2.indexOf("/");
            while (pos!=-1)
            {
                half1 = half2.substring(0, pos);
                half2 = half2.slice(pos + 1);
                arr.push(half1);
                pos = half2.indexOf("/");
            }
            arr.push(half2);
            for (var i = 0; i<arr.length;i++)
            {
                alert(arr[i]);
            }
        }
        let a = prompt("enter a string separated by /");
        sep(a);
    </script>
</body>
</html>
