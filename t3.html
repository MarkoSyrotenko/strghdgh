<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>the</title>
</head>
<body style="background-color: black;">
    <script>
        function compare(a,b)
        {
            if (a < b) return -1;
            else if (a > b) return 1;
            else return 0;
        }
        let a = parseInt(prompt("enter a"));
        let b = parseInt(prompt("enter b"));
        alert(compare(a,b));
    </script>
</body>
