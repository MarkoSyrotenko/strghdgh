<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>the</title>
</head>
<body style="background-color: black;">
    <script>
        function url(str)
        {
            let pos = str.indexOf("://");
            if (pos == -1) {
                return;
            }
            let protocol = str.substring(0, pos);
            let rest = str.slice(pos + 3);
            pos = rest.indexOf("/");
            if (pos == -1) {
                return;
            }   
            let domain = rest.substring(0, pos);
            let path = rest.slice(pos + 1); 
            alert("protocol: " + protocol+"\ndomain: " + domain+"\npath: " + path);
        }
        let a = prompt("enter a url");
        url(a);
    </script>
</body>
</html>
